<style>
html, body { height: 100%; margin: 0; }
/* VidantaMap — guest UI styles. Self-contained, no external assets. */

:root {
  --brand: #0b6b5d;          /* deep resort teal */
  --brand-dark: #08544a;
  --ink: #17342f;
  --muted: #5f7a74;
  --card: rgba(255, 255, 255, 0.94);
  --line: #e3ecea;
  --route: #4f46e5;          /* primary route indigo */
  --route-alt: #64748b;
  --start: #16a34a;
  --end: #dc2626;
  --hotel: #6d5bd0;
  --restaurant: #d97706;
  --bar: #c026d3;
  --pool: #0284c7;
  --amenity: #0b8a6d;
  --radius: 18px;
  --shadow: 0 8px 28px rgba(9, 45, 39, 0.16), 0 2px 6px rgba(9, 45, 39, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: #bfe6da;
  -webkit-font-smoothing: antialiased;
}

/* ---------- map ---------- */

#map {
  position: fixed;
  inset: 0;
  background: #bfe6da;
}

/* ---------- shared card ---------- */

.card {
  background: var(--card);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid rgba(255, 255, 255, 0.6);
}

/* ---------- top card ---------- */

#topcard {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 12px;
  right: 12px;
  max-width: 400px;
  margin: 0 auto;
  padding: 12px 14px 11px;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}

#collapse-btn {
  margin-left: auto;
  width: 28px;
  height: 28px;
  flex: 0 0 28px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: #f2f7f6;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
#collapse-btn:active { transform: translateY(1px); }

/* collapsed top card: a single compact "A → B" bar */
#topcard-mini {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 2px 2px;
  border: none;
  background: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
}
#topcard-mini[hidden] { display: none; }
.mini-dot {
  width: 10px;
  height: 10px;
  flex: 0 0 10px;
  border-radius: 50%;
  background: var(--route);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.16);
}
#mini-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mini-chevron { color: var(--muted); font-size: 12px; }
#topcard.collapsed { padding: 10px 14px; }

.brand-mark {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  border-radius: 10px;
  background: linear-gradient(145deg, var(--brand), #0d8a76);
  color: #fff;
  font-weight: 700;
  font-size: 17px;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 6px rgba(11, 107, 93, 0.35);
}

.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 15px; letter-spacing: 0.2px; }
.brand-text span { font-size: 11px; color: var(--muted); }

.picker-grid {
  display: flex;
  align-items: stretch;
  gap: 10px;
}

.picker-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 15px 0;
  width: 12px;
  flex: 0 0 12px;
}

.rail-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.rail-start { background: var(--start); box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18); }
.rail-end { background: var(--end); box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.16); }
.rail-line { flex: 1; width: 2px; margin: 3px 0; background: repeating-linear-gradient(to bottom, #b7c9c5 0 3px, transparent 3px 7px); }

.picker-fields {
  flex: 1;
  min-width: 0;
  background: #f2f7f6;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 2px 10px;
}

.field {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
}

.field-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  width: 34px;
  flex: 0 0 34px;
}

.field select {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  font: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  padding: 6px 0;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235f7a74' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 2px center;
  padding-right: 18px;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  cursor: pointer;
}

.field-divider { height: 1px; background: var(--line); margin-left: 42px; }

#swap-btn {
  flex: 0 0 40px;
  align-self: center;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--brand);
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(9, 45, 39, 0.08);
  transition: background 0.15s, transform 0.15s;
}
#swap-btn:active { transform: scale(0.94); background: #eef5f3; }

#loc-btn {
  width: 100%;
  margin-top: 8px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #ffffff;
  color: #1d6fd2;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
#loc-btn:active { transform: translateY(1px); }
#loc-btn:disabled { color: var(--muted); cursor: default; }

#go-btn {
  width: 100%;
  margin-top: 10px;
  padding: 11px 16px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(145deg, var(--brand), #0d8a76);
  color: #fff;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.2px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(11, 107, 93, 0.32);
  transition: filter 0.15s, transform 0.1s;
}
#go-btn:active { transform: translateY(1px); }
#go-btn:disabled { filter: grayscale(0.4) opacity(0.7); cursor: default; }

.legend {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-top: 9px;
  font-size: 10.5px;
  color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.lg { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.lg-hotel { background: var(--hotel); }
.lg-bar { background: var(--bar); }
.lg-restaurant { background: var(--restaurant); }
.lg-pool { background: var(--pool); }
.lg-amenity { background: var(--amenity); }

/* ---------- toast ---------- */

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 40;
  max-width: min(92vw, 380px);
  background: rgba(23, 52, 47, 0.94);
  color: #fff;
  font-size: 13.5px;
  line-height: 1.4;
  padding: 11px 16px;
  border-radius: 13px;
  box-shadow: var(--shadow);
  text-align: center;
  animation: toast-in 0.22s ease-out;
}
#toast.error { background: rgba(153, 27, 27, 0.95); }
@keyframes toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ---------- bottom sheet ---------- */

#sheet[hidden] { display: none; }

#sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 480px;
  margin: 0 auto;
  z-index: 30;
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
  padding: 2px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  max-height: 48vh;
  animation: sheet-in 0.25s ease-out;
}
@keyframes sheet-in {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

#sheet-toggle {
  border: none;
  background: transparent;
  padding: 10px 0 6px;
  cursor: pointer;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.grabber {
  display: block;
  width: 56px;
  height: 5.5px;
  border-radius: 3px;
  background: #b9cbc6;
}
.grabber-hint {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: var(--muted);
}

#reverse-btn {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: #eef3f2;
  color: var(--brand);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
#reverse-btn:active { background: #dfe9e6; }

/* floating follow-me button */
#follow-fab {
  position: fixed;
  right: 14px;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  z-index: 25;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.7);
  background: var(--card);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
  color: var(--brand);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, bottom 0.2s;
}
#follow-fab.active { background: #2563eb; border-color: #2563eb; color: #fff; }
#follow-fab.paused { color: #2563eb; }
#follow-fab:active { transform: scale(0.94); }

/* POI category filter chips */
#filters {
  position: fixed;
  left: 12px;
  right: 12px;
  max-width: 400px;
  margin: 0 auto;
  z-index: 19;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px;
}
#filters::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: 999px;
  background: var(--card);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px rgba(9, 45, 39, 0.14);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 11px;
  cursor: pointer;
  white-space: nowrap;
}
.filter-chip .lg { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.filter-chip.off { opacity: 0.45; }
.filter-chip.off .lg { background: #9aa9a5; }

.sheet-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chips {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 2px 0;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  border: 1.5px solid var(--line);
  background: #f2f7f6;
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 13px;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.chip .chip-kind { font-weight: 800; }
.chip.active {
  background: var(--route);
  border-color: var(--route);
  color: #fff;
  box-shadow: 0 3px 10px rgba(79, 70, 229, 0.35);
}
.chip:not(.active) .chip-kind { color: var(--route); }

#sheet-close {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: #eef3f2;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
}
#sheet-close:active { background: #dfe9e6; }

.route-summary {
  margin: 10px 2px 2px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.2px;
}
.route-summary small {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  display: block;
  margin-top: 2px;
}

.steps {
  list-style: none;
  margin-top: 8px;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-bottom: 4px;
}

.steps li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.steps li:last-child { border-bottom: none; }

.step-icon {
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: #eef1ff;
  color: var(--route);
  display: grid;
  place-items: center;
  font-size: 16px;
  font-weight: 700;
}
.steps li.arrive .step-icon { background: #fdeaea; color: var(--end); }

.step-text { flex: 1; min-width: 0; }
.step-dist { flex: 0 0 auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* collapsed: keep grabber + chips visible, hide details */
#sheet.collapsed .route-summary,
#sheet.collapsed .steps { display: none; }

/* ---------- SVG map overlay styles ---------- */

.route-casing {
  fill: none;
  stroke: #ffffff;
  stroke-width: 9;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  opacity: 0.9;
}
.route-primary {
  fill: none;
  stroke: var(--route);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.route-alt {
  fill: none;
  stroke: var(--route-alt);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 2 10;
  vector-effect: non-scaling-stroke;
  opacity: 0.95;
}

.dot circle.dot-core { stroke: #ffffff; stroke-width: 2; }
.dot { cursor: pointer; }
.dot-label {
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 600;
  fill: #234b44;
  stroke: rgba(255, 255, 255, 0.92);
  stroke-width: 3;
  paint-order: stroke;
  text-anchor: middle;
  pointer-events: none;
}
.labels-hidden .dot-label { display: none; }
.dot.selected circle.dot-core { stroke-width: 2.5; }

.pin-shadow { fill: rgba(9, 45, 39, 0.25); }

/* ---------- small screens ---------- */

@media (max-width: 419px) {
  #topcard { left: 8px; right: 8px; }
  .legend span { font-size: 10px; }
}

/* short screens: tighter top card */
@media (max-height: 640px) {
  .brand { margin-bottom: 6px; }
  #sheet { max-height: 42vh; }
}

</style>

<script>
/* MapView — shared pan/zoom SVG map component over the resort map image.
 * See SPEC.md for the public API. No dependencies.
 */
(function () {
  const SVG_NS = 'http://www.w3.org/2000/svg';

  function el(tag, attrs) {
    const node = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  class MapView {
    constructor(container, config) {
      this.container = container;
      this.config = config;
      this.mapW = config.width;
      this.mapH = config.height;

      // view state: map-coordinate rect currently shown
      this.view = { x: 0, y: 0, w: this.mapW, h: this.mapH };

      this.svg = el('svg', {
        width: '100%',
        height: '100%',
        preserveAspectRatio: 'xMidYMid meet'
      });
      this.svg.style.touchAction = 'none';
      this.svg.style.userSelect = 'none';
      this.svg.style.webkitUserSelect = 'none';
      // stop iOS long-press from opening the image save/copy callout
      this.svg.style.webkitTouchCallout = 'none';
      this.svg.style.display = 'block';
      this.svg.style.cursor = 'grab';

      const image = el('image', {
        href: config.mapImage,
        x: 0, y: 0,
        width: this.mapW, height: this.mapH
      });
      this.svg.appendChild(image);

      this.overlay = el('g');
      this.svg.appendChild(this.overlay);

      container.appendChild(this.svg);

      this._clickHandlers = [];
      this._viewHandlers = [];
      this._pointers = new Map();
      this._dragged = false;
      this._pinchStart = null;

      this._bindEvents();
      this.fitAll();
    }

    /* ------------ public API ------------ */

    get scale() {
      const r = this.svg.getBoundingClientRect();
      // 'meet' scaling: uniform scale is min of both axes
      return Math.min(r.width / this.view.w, r.height / this.view.h);
    }

    onClick(fn) { this._clickHandlers.push(fn); }
    onViewChanged(fn) { this._viewHandlers.push(fn); }

    screenToMap(clientX, clientY) {
      const pt = this.svg.createSVGPoint();
      pt.x = clientX; pt.y = clientY;
      const ctm = this.svg.getScreenCTM();
      if (!ctm) return { x: 0, y: 0 };
      const p = pt.matrixTransform(ctm.inverse());
      return { x: p.x, y: p.y };
    }

    fitAll() {
      this._setView(0, 0, this.mapW, this.mapH);
    }

    /** Center on a map point without changing the zoom level. */
    centerOn(x, y) {
      this._setView(x - this.view.w / 2, y - this.view.h / 2, this.view.w, this.view.h);
    }

    zoomTo(x, y, targetScale) {
      const r = this.svg.getBoundingClientRect();
      const s = targetScale || Math.min(r.width / this.mapW, r.height / this.mapH) * 3;
      const w = r.width / s, h = r.height / s;
      this._setView(x - w / 2, y - h / 2, w, h);
    }

    /** Fit a bounding box (map coords) with padding (map px). */
    fitBounds(minX, minY, maxX, maxY, pad) {
      pad = pad == null ? 60 : pad;
      const r = this.svg.getBoundingClientRect();
      let w = Math.max(maxX - minX + pad * 2, 40);
      let h = Math.max(maxY - minY + pad * 2, 40);
      // match container aspect so target area is fully visible
      const aspect = r.width / r.height;
      if (w / h < aspect) w = h * aspect; else h = w / aspect;
      this._setView((minX + maxX) / 2 - w / 2, (minY + maxY) / 2 - h / 2, w, h);
    }

    /* ------------ internals ------------ */

    _setView(x, y, w, h) {
      // clamp zoom-in level and keep the map roughly in frame
      const minW = this.mapW / 12;
      if (w < minW) { const c = x + w / 2, cy = y + h / 2, ratio = minW / w; w = minW; h = h * ratio; x = c - w / 2; y = cy - h / 2; }
      const maxW = this.mapW * 2.5;
      if (w > maxW) { const c = x + w / 2, cy = y + h / 2, ratio = maxW / w; w = maxW; h = h * ratio; x = c - w / 2; y = cy - h / 2; }
      const margX = w * 0.6, margY = h * 0.6;
      x = Math.min(Math.max(x, -margX), this.mapW - w + margX);
      y = Math.min(Math.max(y, -margY), this.mapH - h + margY);
      this.view = { x, y, w, h };
      this.svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
      for (const fn of this._viewHandlers) fn();
    }

    _bindEvents() {
      const svg = this.svg;

      svg.addEventListener('pointerdown', (e) => {
        svg.setPointerCapture(e.pointerId);
        this._pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        this._dragged = false;
        if (this._pointers.size === 2) {
          const [a, b] = [...this._pointers.values()];
          this._pinchStart = {
            dist: Math.hypot(a.x - b.x, a.y - b.y),
            view: { ...this.view },
            center: this.screenToMap((a.x + b.x) / 2, (a.y + b.y) / 2)
          };
        }
        svg.style.cursor = 'grabbing';
      });

      svg.addEventListener('pointermove', (e) => {
        if (!this._pointers.has(e.pointerId)) return;
        const prev = this._pointers.get(e.pointerId);
        const cur = { x: e.clientX, y: e.clientY };

        if (this._pointers.size === 1) {
          const dx = cur.x - prev.x, dy = cur.y - prev.y;
          if (Math.abs(dx) + Math.abs(dy) > 0) {
            const s = this.scale;
            if (Math.abs(dx) + Math.abs(dy) > 3) this._dragged = true;
            this._setView(this.view.x - dx / s, this.view.y - dy / s, this.view.w, this.view.h);
          }
        } else if (this._pointers.size === 2 && this._pinchStart) {
          this._pointers.set(e.pointerId, cur);
          const [a, b] = [...this._pointers.values()];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist > 0 && this._pinchStart.dist > 0) {
            this._dragged = true;
            const factor = this._pinchStart.dist / dist;
            const v0 = this._pinchStart.view;
            const c = this._pinchStart.center;
            const w = v0.w * factor, h = v0.h * factor;
            const fx = (c.x - v0.x) / v0.w, fy = (c.y - v0.y) / v0.h;
            this._setView(c.x - fx * w, c.y - fy * h, w, h);
          }
          return;
        }
        this._pointers.set(e.pointerId, cur);
      });

      const endPointer = (e) => {
        if (!this._pointers.has(e.pointerId)) return;
        this._pointers.delete(e.pointerId);
        if (this._pointers.size < 2) this._pinchStart = null;
        if (this._pointers.size === 0) {
          svg.style.cursor = 'grab';
          if (!this._dragged && e.type === 'pointerup') {
            const p = this.screenToMap(e.clientX, e.clientY);
            for (const fn of this._clickHandlers) fn({ x: p.x, y: p.y, event: e });
          }
        }
      };
      svg.addEventListener('pointerup', endPointer);
      svg.addEventListener('pointercancel', endPointer);

      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = Math.exp(e.deltaY * 0.0015);
        const c = this.screenToMap(e.clientX, e.clientY);
        const v = this.view;
        const w = v.w * factor, h = v.h * factor;
        const fx = (c.x - v.x) / v.w, fy = (c.y - v.y) / v.h;
        this._setView(c.x - fx * w, c.y - fy * h, w, h);
      }, { passive: false });

      window.addEventListener('resize', () => {
        for (const fn of this._viewHandlers) fn();
      });
    }
  }

  MapView.el = el;
  window.MapView = MapView;
})();

<script>
// Routing engine (lib/routing.js) wrapped for the browser
window.Routing = (function () {
  var module = { exports: {} };
'use strict';

/**
 * lib/routing.js — pure routing logic for VidantaMap.
 *
 * Dijkstra over the undirected path graph with two weightings:
 *   - shortest: minimize distance (meters)
 *   - fastest:  minimize time (seconds), edge time = length / walkSpeed(pathType)
 *
 * No I/O here; the graph object is passed in.
 */

const DEFAULT_SPEED_KEY = 'boardwalk';
const DEFAULT_SPEED = 1.4; // m/s, last-resort fallback

/** Error with a machine-readable code: 'bad-node' | 'no-route'. */
class RoutingError extends Error {
  constructor(code, message) {
    super(message);
    this.name = 'RoutingError';
    this.code = code;
  }
}

/** Walking speed (m/s) for a pathType; unknown types fall back to boardwalk speed. */
function walkSpeed(config, pathType) {
  const speeds = (config && config.walkSpeeds) || {};
  const s = speeds[pathType];
  if (typeof s === 'number' && s > 0) return s;
  const fallback = speeds[DEFAULT_SPEED_KEY];
  return typeof fallback === 'number' && fallback > 0 ? fallback : DEFAULT_SPEED;
}

/* Routing weight multiplier per pathType. Paved segments are cart roads —
 * pedestrians may cross them or use short stints near buildings, but any
 * boardwalk alternative should win, so traveling along them costs ×4 by
 * default. Reported distances/times stay real; only route CHOICE is biased.
 * Override via config.routePenalties, e.g. { "paved": 4 }. */
const DEFAULT_PENALTIES = { paved: 4 };

function routePenalty(config, pathType) {
  const penalties = (config && config.routePenalties) || DEFAULT_PENALTIES;
  const p = penalties[pathType];
  return typeof p === 'number' && p > 0 ? p : 1;
}

/** Euclidean length of an edge in meters (px distance × metersPerPixel). */
function edgeLengthMeters(config, a, b) {
  const mpp =
    config && typeof config.metersPerPixel === 'number' && config.metersPerPixel > 0
      ? config.metersPerPixel
      : 1;
  return Math.hypot(b.x - a.x, b.y - a.y) * mpp;
}

/** Map of nodeId → node. */
function nodeMap(graph) {
  const m = new Map();
  for (const n of graph.nodes) m.set(n.id, n);
  return m;
}

/**
 * Adjacency list: nodeId → [{ to, lengthMeters, timeSeconds, pathType }].
 * Edges are undirected, so each edge appears in both directions.
 */
function buildAdjacency(graph) {
  const nodes = nodeMap(graph);
  const adj = new Map();
  for (const id of nodes.keys()) adj.set(id, []);
  for (const e of graph.edges) {
    const a = nodes.get(e.from);
    const b = nodes.get(e.to);
    if (!a || !b || a === b) continue; // defensive; validated at PUT time
    const lengthMeters = edgeLengthMeters(graph.config, a, b);
    const timeSeconds = lengthMeters / walkSpeed(graph.config, e.pathType);
    const penalty = routePenalty(graph.config, e.pathType);
    adj.get(e.from).push({ to: e.to, lengthMeters, timeSeconds, penalty, pathType: e.pathType });
    adj.get(e.to).push({ to: e.from, lengthMeters, timeSeconds, penalty, pathType: e.pathType });
  }
  return adj;
}

/**
 * Dijkstra shortest path by an arbitrary edge weight.
 * weightOf(edgeEntry) → non-negative number.
 * Returns array of nodeIds from fromId to toId, or null if unreachable.
 */
function dijkstra(graph, fromId, toId, weightOf, adj) {
  adj = adj || buildAdjacency(graph);
  const dist = new Map();
  const prev = new Map();
  const visited = new Set();
  dist.set(fromId, 0);

  // Graph is small (tens of nodes); a linear-scan "priority queue" is fine.
  while (true) {
    let u = null;
    let best = Infinity;
    for (const [id, d] of dist) {
      if (!visited.has(id) && d < best) {
        best = d;
        u = id;
      }
    }
    if (u === null) return null; // frontier empty, target unreachable
    if (u === toId) break;
    visited.add(u);
    for (const edge of adj.get(u) || []) {
      if (visited.has(edge.to)) continue;
      const nd = best + weightOf(edge);
      if (nd < (dist.has(edge.to) ? dist.get(edge.to) : Infinity)) {
        dist.set(edge.to, nd);
        prev.set(edge.to, u);
      }
    }
  }

  const path = [toId];
  while (path[0] !== fromId) path.unshift(prev.get(path[0]));
  return path;
}

/** Compass bearing of segment a→b in degrees [0, 360). North = up (−y on screen). */
function bearing(a, b) {
  const deg = (Math.atan2(b.x - a.x, -(b.y - a.y)) * 180) / Math.PI;
  return (deg + 360) % 360;
}

const COMPASS = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'];

/** 8-point compass name for a bearing. */
function compassName(deg) {
  return COMPASS[Math.round(deg / 45) % 8];
}

/** Signed smallest angle from bearing b1 to b2, in (−180, 180]. Positive = right turn. */
function bearingDelta(b1, b2) {
  return ((b2 - b1 + 540) % 360) - 180;
}

/** Human phrase for a pathType, used in the initial "Head …" step. */
function pathPhrase(pathType) {
  switch (pathType) {
    case 'boardwalk': return 'the boardwalk';
    case 'paved': return 'the paved path';
    case 'trail': return 'the trail';
    case 'stairs': return 'the stairs';
    case 'connector': return 'the nearest path'; // dropped-pin → path link
    default: return 'the path';
  }
}

/* ---------------- dropped-pin support ----------------
 * A route endpoint may be raw map coordinates ("x,y") instead of a node id.
 * The point is snapped to the closest position on the closest path segment;
 * that segment is split by a virtual node, and (if the pin is off the path)
 * a short "connector" edge links the pin itself to the snapped point, so the
 * walk from the pin to the path is included in distance/time/steps.
 */

/** Parse "x,y" coordinate endpoint form → {x, y}, or null if not that form. */
function parsePin(value) {
  const m = /^(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(String(value).trim());
  if (!m) return null;
  return { x: parseFloat(m[1]), y: parseFloat(m[2]) };
}

/** Closest point on segment ab to p, plus its parameter t along ab. */
function projectOnSegment(p, a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len2 = dx * dx + dy * dy;
  const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2));
  return { x: a.x + t * dx, y: a.y + t * dy, t };
}

/** Nearest point on any edge of the graph to p → { edge, point } or null. */
function snapToPath(graph, p) {
  const nodes = nodeMap(graph);
  let best = null;
  let bestDist = Infinity;
  for (const e of graph.edges) {
    const a = nodes.get(e.from);
    const b = nodes.get(e.to);
    if (!a || !b) continue;
    const q = projectOnSegment(p, a, b);
    const d = Math.hypot(q.x - p.x, q.y - p.y);
    if (d < bestDist) {
      bestDist = d;
      best = { edge: e, point: { x: q.x, y: q.y } };
    }
  }
  return best;
}

/**
 * Mutates graph copy g: snaps pin point p onto the nearest path segment,
 * splits that segment with a virtual node, and (when the pin is off-path)
 * adds a pin node + connector edge. Returns the routing endpoint node id.
 * Virtual ids start with "__pin" so they can never collide with real ids
 * (admin-created ids are slugs/j-numbers).
 */
function insertPin(g, key, p) {
  const snap = snapToPath(g, p);
  if (!snap) throw new RoutingError('no-route', 'no paths to snap to');

  const snapId = `__pin_${key}_snap`;
  g.nodes.push({ id: snapId, name: 'Dropped pin', type: 'junction', x: snap.point.x, y: snap.point.y, destination: false });

  // replace the snapped edge with its two halves
  g.edges = g.edges.filter((e) => e !== snap.edge);
  g.edges.push(
    { id: `${snap.edge.id}__${key}a`, from: snap.edge.from, to: snapId, pathType: snap.edge.pathType },
    { id: `${snap.edge.id}__${key}b`, from: snapId, to: snap.edge.to, pathType: snap.edge.pathType }
  );

  // pin more than ~2 px off the path → walk a connector from the pin itself
  if (Math.hypot(snap.point.x - p.x, snap.point.y - p.y) > 2) {
    const pinId = `__pin_${key}`;
    g.nodes.push({ id: pinId, name: 'Dropped pin', type: 'pin', x: p.x, y: p.y, destination: false });
    g.edges.push({ id: `${pinId}_link`, from: pinId, to: snapId, pathType: 'connector' });
    return pinId;
  }
  return snapId;
}

const TURN_THRESHOLD = 35; // deg: > 35 → Turn
const BEAR_THRESHOLD = 20; // deg: > 20 and ≤ 35 → Bear; ≤ 20 → straight (merge)

/**
 * Turn-by-turn steps from a node path.
 * - First step: "Head <compass direction> on <path phrase>".
 * - Bearing change > 35° → "Turn left/right"; 20–35° → "Bear left/right";
 *   ≤ 20° → merged into the current step (distances summed).
 * - Last step: "Arrive at <name>" with distanceMeters 0.
 */
function buildSteps(graph, pathNodes, pathEdges) {
  const destNode = pathNodes[pathNodes.length - 1];
  const arriveName = destNode.name || destNode.id;
  const steps = [];

  if (pathNodes.length >= 2) {
    const bearings = [];
    for (let i = 0; i < pathNodes.length - 1; i++) {
      bearings.push(bearing(pathNodes[i], pathNodes[i + 1]));
    }
    let text = `Head ${compassName(bearings[0])} on ${pathPhrase(pathEdges[0].pathType)}`;
    let dist = pathEdges[0].lengthMeters;
    for (let i = 1; i < bearings.length; i++) {
      const delta = bearingDelta(bearings[i - 1], bearings[i]);
      const mag = Math.abs(delta);
      if (mag > BEAR_THRESHOLD) {
        steps.push({ text, distanceMeters: Math.round(dist) });
        const verb = mag > TURN_THRESHOLD ? 'Turn' : 'Bear';
        text = `${verb} ${delta > 0 ? 'right' : 'left'}`;
        dist = pathEdges[i].lengthMeters;
      } else {
        dist += pathEdges[i].lengthMeters;
      }
    }
    steps.push({ text, distanceMeters: Math.round(dist) });
  }

  steps.push({ text: `Arrive at ${arriveName}`, distanceMeters: 0 });
  return steps;
}

/** Build a RouteResult (spec schema) from a node-id path. */
function routeResult(graph, nodeIds, adj) {
  const nodes = nodeMap(graph);
  const pathNodes = nodeIds.map((id) => nodes.get(id));

  // Resolve the traversed edge entries (for length/time/pathType per hop).
  const pathEdges = [];
  let distanceMeters = 0;
  let timeSeconds = 0;
  for (let i = 0; i < nodeIds.length - 1; i++) {
    const entries = adj.get(nodeIds[i]) || [];
    // If multiple parallel edges exist, take the cheapest by time (matches Dijkstra's preference).
    let bestEdge = null;
    for (const e of entries) {
      if (e.to === nodeIds[i + 1] && (!bestEdge || e.timeSeconds < bestEdge.timeSeconds)) {
        bestEdge = e;
      }
    }
    pathEdges.push(bestEdge);
    distanceMeters += bestEdge.lengthMeters;
    timeSeconds += bestEdge.timeSeconds;
  }

  return {
    nodeIds: nodeIds.slice(),
    coords: pathNodes.map((n) => ({ x: n.x, y: n.y })),
    distanceMeters: Math.round(distanceMeters),
    timeSeconds: Math.round(timeSeconds),
    steps: buildSteps(graph, pathNodes, pathEdges),
  };
}

/**
 * Full /api/route response body:
 *   { from, to, routes: { shortest: RouteResult, fastest: RouteResult } }
 * Throws RoutingError('bad-node') for unknown ids,
 * RoutingError('no-route') when no path exists.
 */
function buildRouteResponse(graph, fromId, toId) {
  const fromPin = parsePin(fromId);
  const toPin = parsePin(toId);

  // Dropped-pin endpoints route over a copy of the graph augmented with
  // virtual nodes; the stored graph is never mutated.
  let g = graph;
  const pins = {};
  let from = fromId;
  let to = toId;
  if (fromPin || toPin) {
    g = { config: graph.config, nodes: graph.nodes.slice(), edges: graph.edges.slice() };
    // Insert sequentially so a second pin can snap onto a half produced by
    // splitting for the first (both pins on the same original segment).
    if (fromPin) {
      from = insertPin(g, 'from', fromPin);
      pins.from = fromPin;
    }
    if (toPin) {
      to = insertPin(g, 'to', toPin);
      pins.to = toPin;
    }
  }

  const nodes = nodeMap(g);
  for (const id of [from, to]) {
    if (!nodes.has(id)) throw new RoutingError('bad-node', `unknown node id: ${id}`);
  }
  if (from === to) throw new RoutingError('bad-node', 'from and to are the same point');

  const adj = buildAdjacency(g);
  const shortestPath = dijkstra(g, from, to, (e) => e.lengthMeters * e.penalty, adj);
  if (!shortestPath) throw new RoutingError('no-route', 'no-route');
  const fastestPath = dijkstra(g, from, to, (e) => e.timeSeconds * e.penalty, adj);

  const resp = {
    from: fromId,
    to: toId,
    routes: {
      shortest: routeResult(g, shortestPath, adj),
      fastest: routeResult(g, fastestPath, adj),
    },
  };
  if (fromPin || toPin) resp.pins = pins;
  return resp;
}

module.exports = {
  buildRouteResponse,
  RoutingError,
  // internals exported for testing/reuse
  dijkstra,
  buildAdjacency,
  walkSpeed,
  edgeLengthMeters,
  bearing,
  bearingDelta,
  compassName,
  buildSteps,
  parsePin,
  snapToPath,
  routePenalty,
};

  return module.exports;
})();

    if (u.indexOf('/api/route') === 0) {
      var q = new URLSearchParams(u.split('?')[1] || '');
      try {
        return Promise.resolve(json(
          window.Routing.buildRouteResponse(GRAPH, q.get('from'), q.get('to'))));
      } catch (err) {
        if (err && err.code === 'no-route') return Promise.resolve(json({ error: 'no-route' }, 404));

<script>
/* VidantaMap — guest UI. Builds on the shared MapView component (mapview.js).
 * Fetches /api/graph on load, /api/route?from&to on request, draws both route
 * options (fastest highlighted, shortest dashed when different) plus start/end
 * pins and destination dots, and shows turn-by-turn steps in a bottom sheet.

(function () {
  'use strict';

  var TYPE_ORDER = ['hotel', 'restaurant', 'bar', 'pool', 'amenity'];

    hotel: 'Hotels',

    pool: 'Pools',
    amenity: 'Amenities'
  };
  var TYPE_COLORS = {
    hotel: '#6d5bd0',
    restaurant: '#d97706',
    bar: '#c026d3',
    pool: '#0284c7',
    amenity: '#0b8a6d'
  };
  var LABEL_MIN_SCALE = 0.42; // hide dot labels when zoomed out beyond this

  var $ = function (id) { return document.getElementById(id); };

  var els = {
    map: $('map'),
    from: $('from-select'),
    to: $('to-select'),
    swap: $('swap-btn'),
    go: $('go-btn'),
    loc: $('loc-btn'),
    topcard: $('topcard'),
    topFull: $('topcard-full'),
    topMini: $('topcard-mini'),
    miniText: $('mini-text'),
    collapse: $('collapse-btn'),
    filters: $('filters'),

    fab: $('follow-fab'),
    toast: $('toast'),

    sheetClose: $('sheet-close'),
    chips: $('chips'),
    summary: $('route-summary'),
    steps: $('steps')
  };

  var mv = null;
  var graph = null;
  var nodesById = {};
  var gRoutes, gDots, gPins;   // overlay layers (routes under dots under pins)
  var route = null;            // last /api/route response
  var selectedOpt = 'fastest';
  var toastTimer = null;

  var PIN_VALUE = '__pin';     // select value representing a dropped pin
  var pins = { from: null, to: null };  // dropped-pin map coords per side
  var suppressTap = false;     // swallow the tap that ends a long-press
  var fromIsLocation = false;  // From pin came from device GPS (blue-dot marker)

    return typeVisible[type] !== undefined ? typeVisible[type] : typeVisible.amenity;
  }
  // pending GPS→map calibration: { lat, lng, soft, expires }

  var pendingCal = null;

  /* ---------------- helpers ---------------- */

  function typeColor(type) { return TYPE_COLORS[type] || '#64748b'; }

  function fmtTime(seconds) {
    var m = Math.max(1, Math.round(seconds / 60));
    if (m < 60) return m + ' min';
    return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }

  function fmtDist(meters) {
    if (meters >= 1000) return (meters / 1000).toFixed(1) + ' km';
    return Math.round(meters) + ' m';
  }

  function showToast(msg, isError, ms) {
    els.toast.textContent = msg;
    els.toast.classList.toggle('error', !!isError);
    els.toast.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    if (ms !== 0) {
      toastTimer = setTimeout(function () { els.toast.hidden = true; }, ms || 3800);

  }

  function hideToast() {
    if (toastTimer) clearTimeout(toastTimer);
    els.toast.hidden = true;
  }

  /* ---------------- boot ---------------- */

  function init() {
    fetch('/api/graph')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (g) {
        graph = g;
        graph.nodes.forEach(function (n) { nodesById[n.id] = n; });
        // a calibration done on this device beats the shipped estimate
        try {
          var savedGeo = localStorage.getItem(GEO_STORE_KEY);
          if (savedGeo) graph.config.geo = JSON.parse(savedGeo);
        } catch (e) { /* private mode etc. — ignore */ }
        setupMap();
        buildSelects();
        wireUi();
        wireFilters();
      })
      .catch(function () {
        showToast('Could not load the resort map. Please check the connection and refresh.', true, 0);
      });
  }

  function setupMap() {
    mv = new MapView(els.map, graph.config);
    gRoutes = MapView.el('g');
    gDots = MapView.el('g');
    gPins = MapView.el('g');
    mv.overlay.appendChild(gRoutes);
    mv.overlay.appendChild(gDots);
    mv.overlay.appendChild(gPins);

    drawDestinationDots();
    mv.onViewChanged(updateScaledMarkers);
    mv.onClick(handleMapTap);
    bindLongPress();
    bindPanPausesFollow();
    updateScaledMarkers();
  }

  /* Long-press (hold ~0.5s without moving) anywhere → drop a pin there. */
  function bindLongPress() {
    var timer = null;
    var start = null;

    function cancel() {
      if (timer) clearTimeout(timer);
      timer = null;
      start = null;
    }

    mv.svg.addEventListener('pointerdown', function (e) {
      if (timer) { cancel(); return; }   // second finger → pinch, not a pin
      start = { x: e.clientX, y: e.clientY };
      timer = setTimeout(function () {
        var p = mv.screenToMap(start.x, start.y);
        timer = null;
        suppressTap = true;              // the pointerup would otherwise re-fire a tap
        dropPin(p);
      }, 550);
    });
    mv.svg.addEventListener('pointermove', function (e) {
      if (!start) return;
      if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) cancel();
    });
    mv.svg.addEventListener('pointerup', cancel);
    mv.svg.addEventListener('pointercancel', cancel);
    mv.svg.addEventListener('wheel', cancel);
  }

  /* First pin (or a fresh start) becomes From; the second becomes To + routes. */
  function dropPin(p) {
    var point = { x: Math.round(p.x), y: Math.round(p.y) };
    if (point.x < 0 || point.y < 0 ||
        point.x > graph.config.width || point.y > graph.config.height) return;

    if (!els.from.value || (els.from.value && els.to.value)) {
      pins.from = point;
      pins.to = null;
      fromIsLocation = false;
      setPinOption(els.from);
      removePinOption(els.to);
      els.to.value = '';
      clearRoute();
      showToast('Pin dropped as your starting point. Now tap a place or hold to drop another pin.');
    } else {
      pins.to = point;
      setPinOption(els.to);
      getDirections();
    }
    updatePins();
  }

  /* ---------------- current location (GPS) ---------------- */

  /* Linear lat/lng → map px using the config.geo corner calibration. */
  function gpsToMap(lat, lng) {
    var geo = graph.config.geo;
    if (!geo || !geo.topLeft || !geo.bottomRight) return null;
    return {
      x: (lng - geo.topLeft.lng) / (geo.bottomRight.lng - geo.topLeft.lng) * graph.config.width,
      y: (lat - geo.topLeft.lat) / (geo.bottomRight.lat - geo.topLeft.lat) * graph.config.height
    };
  }

  /* One-point calibration: the user stands at map point (x, y) with GPS
   * (lat, lng). Combined with the map's meters-per-pixel scale and a
   * north-up map, that fully determines the corner coordinates. */
  function geoFromAnchor(lat, lng, x, y) {
    var mpp = graph.config.metersPerPixel || 1;
    var latSpan = graph.config.height * mpp / 110540;                       // ° per map height
    var lngSpan = graph.config.width * mpp / (111320 * Math.cos(lat * Math.PI / 180));
    var topLat = lat + (y / graph.config.height) * latSpan;
    var topLng = lng - (x / graph.config.width) * lngSpan;
    return {
      comment: 'Calibrated in-app from a GPS fix at a user-tapped map point (north-up assumed).',
      topLeft: { lat: topLat, lng: topLng },
      bottomRight: { lat: topLat - latSpan, lng: topLng + lngSpan }
    };
  }

  function calibrateAt(p) {
    var cal = pendingCal;
    pendingCal = null;
    hideToast();
    var x = Math.round(Math.min(Math.max(p.x, 0), graph.config.width));
    var y = Math.round(Math.min(Math.max(p.y, 0), graph.config.height));
    graph.config.geo = geoFromAnchor(cal.lat, cal.lng, x, y);
    try { localStorage.setItem(GEO_STORE_KEY, JSON.stringify(graph.config.geo)); } catch (e) { /* ignore */ }
    // best effort: persist for everyone when the real server is behind us
    try {
      fetch('/api/graph', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(graph)
      }).catch(function () { /* static demo / offline — device copy still saved */ });
    } catch (e) { /* ignore */ }

    pins.from = { x: x, y: y };
    fromIsLocation = true;
    setPinOption(els.from, '⌖ My location');
    clearRoute();
    updatePins();
    if (following()) { hadFix = true; ensureLiveDot(x, y); }
    mv.zoomTo(x, y);
    if (els.to.value) getDirections();
    else showToast('Map calibrated to your GPS ✓ Starting from your location — now pick a destination.');
  }

  /* True when we're inside a cross-origin iframe whose permissions policy
   * blocks geolocation (e.g. an embedded demo view) — the browser then
   * auto-denies without ever prompting the user. */
  function geoBlockedByFrame() {
    try {
      if (window.self === window.top) return false;
      if (document.featurePolicy && document.featurePolicy.allowsFeature) {
        return !document.featurePolicy.allowsFeature('geolocation');
      }
    } catch (e) { /* fall through */ }
    return false;
  }

  var MANUAL_TIP = ' You can still set your start manually: press and hold the map where you are.';

  /* Live follow-me tracking: watchPosition keeps the blue dot on your real
   * position as you walk; the map recenters on you every few seconds until
   * you pan it yourself (tap ⌖ again to re-center, tap once more to stop). */
  var watchId = null;         // active geolocation watch
  var autoCenter = false;     // keep the map centered on the live dot
  var lastCenter = 0;         // last auto-recenter time (throttled)
  var liveDot = null;         // the moving blue-dot marker
  var hadFix = false;         // got at least one usable fix this session
  var CENTER_EVERY_MS = 4000;

  function following() { return watchId !== null; }

  function ensureLiveDot(x, y) {
    if (!liveDot) {
      liveDot = makeLocationDot();
      mv.overlay.appendChild(liveDot);
    }
    liveDot.dataset.mx = x;
    liveDot.dataset.my = y;
    updateScaledMarkers();
  }

  function removeLiveDot() {
    if (liveDot && liveDot.parentNode) liveDot.parentNode.removeChild(liveDot);
    liveDot = null;
  }

  function updateFollowUi() {
    var fab = els.fab;
    fab.classList.toggle('active', following() && autoCenter);
    fab.classList.toggle('paused', following() && !autoCenter);
    els.loc.textContent = !following() ? '⌖ Follow my location'
      : autoCenter ? '⌖ Following you — tap to stop'
      : '⌖ Tap to re-center on me';
    fab.title = els.loc.textContent.replace('⌖ ', '');
  }

  function stopFollowing() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    autoCenter = false;
    hadFix = false;
    removeLiveDot();
    updateFollowUi();
  }

  function onFix(pos) {
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    var p = gpsToMap(lat, lng);
    var marginX = graph.config.width * 0.12, marginY = graph.config.height * 0.12;
    if (!p || p.x < -marginX || p.y < -marginY ||
        p.x > graph.config.width + marginX || p.y > graph.config.height + marginY) {
      // likely mis-calibrated GPS anchoring — one tap from the user fixes it
      if (!pendingCal && !hadFix) {
        pendingCal = { lat: lat, lng: lng, soft: false };
        showToast('Your GPS position lands off this map — the calibration is probably off. Tap the map exactly where you are standing and I’ll recalibrate.', true, 0);
      } else if (pendingCal && !pendingCal.soft) {
        pendingCal.lat = lat; pendingCal.lng = lng;  // keep the freshest fix
      }
      return;
    }
    var x = Math.round(Math.min(Math.max(p.x, 0), graph.config.width));
    var y = Math.round(Math.min(Math.max(p.y, 0), graph.config.height));
    var first = !hadFix;
    hadFix = true;
    ensureLiveDot(x, y);

    if (first) {
      // brief window to correct a wrong-but-in-bounds dot with a tap
      pendingCal = { lat: lat, lng: lng, soft: true, expires: Date.now() + 15000 };
      if (!els.from.value || fromIsLocation) {
        pins.from = { x: x, y: y };
        fromIsLocation = true;
        setPinOption(els.from, '⌖ My location');
        updatePins();
        if (els.to.value && !route) getDirections();
      }
      mv.zoomTo(x, y);
      lastCenter = Date.now();
      showToast('Following your location — the blue dot updates as you walk. Wrong spot? Tap the map where you actually are.', false, 7000);
      return;
    }
    if (autoCenter && Date.now() - lastCenter >= CENTER_EVERY_MS) {
      mv.centerOn(x, y);
      lastCenter = Date.now();
    }
  }

  function onFixError(err) {
    if (err && err.code === 1) {
      stopFollowing();
      var msg = geoBlockedByFrame()
        ? 'This embedded demo view blocks location access.' + MANUAL_TIP
        : 'Location permission was denied. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using.' + MANUAL_TIP;
      showToast(msg, true, 9000);
    }
    // transient errors (timeout / temporarily unavailable): keep watching
  }

  function useMyLocation() {
    if (following()) {
      if (!autoCenter) {           // panned away → snap back to me
        autoCenter = true;
        if (liveDot) { mv.centerOn(+liveDot.dataset.mx, +liveDot.dataset.my); lastCenter = Date.now(); }
        updateFollowUi();
      } else {
        stopFollowing();
      }
      return;
    }
    if (!navigator.geolocation) {
      showToast('Location is not available in this browser.' + MANUAL_TIP, true, 8000);
      return;
    }
    if (!window.isSecureContext) {
      showToast('Location needs a secure (HTTPS) connection — this page is plain HTTP, so the phone blocks GPS.' + MANUAL_TIP, true, 8000);
      return;
    }
    if (geoBlockedByFrame()) {
      showToast('This embedded demo view blocks location access.' + MANUAL_TIP, true, 8000);
      return;
    }
    if (!graph.config.geo) {
      showToast('This map has no GPS calibration yet — ask the resort to set it up.', true);
      return;
    }
    autoCenter = true;
    watchId = navigator.geolocation.watchPosition(onFix, onFixError, {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 15000
    });
    updateFollowUi();
  }

  /* Panning by hand pauses auto-centering (tracking continues). */
  function bindPanPausesFollow() {
    function paused() {
      if (following() && autoCenter) {
        autoCenter = false;
        updateFollowUi();
      }
    }
    mv.svg.addEventListener('pointermove', function (e) {
      if (e.buttons) paused();
    });
    mv.svg.addEventListener('wheel', paused);
  }

  function setPinOption(sel, label) {
    var opt = sel.querySelector('option[value="' + PIN_VALUE + '"]');
    if (!opt) {
      opt = document.createElement('option');
      opt.value = PIN_VALUE;
      sel.insertBefore(opt, sel.firstChild.nextSibling); // right after placeholder
    }
    opt.textContent = label || '📍 Dropped pin';
    sel.value = PIN_VALUE;
  }

  function removePinOption(sel) {
    var opt = sel.querySelector('option[value="' + PIN_VALUE + '"]');
    if (opt) opt.remove();
  }

  /* Endpoint helpers: a side is either a node id or a dropped pin. */
  function sideOf(sel) { return sel === els.from ? 'from' : 'to'; }

  function endpointParam(sel) {
    if (sel.value === PIN_VALUE) {
      var p = pins[sideOf(sel)];
      return p ? p.x + ',' + p.y : '';
    }
    return sel.value;
  }

  function endpointCoords(sel) {
    if (sel.value === PIN_VALUE) return pins[sideOf(sel)];
    var n = nodesById[sel.value];
    return n ? { x: n.x, y: n.y } : null;
  }

  function endpointName(param) {
    if (nodesById[param]) return nodesById[param].name;
    if (/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(param)) return 'Dropped pin';
    return param;
  }

  /* Display name for a select's current choice ('' when unset). */
  function sideName(sel) {
    if (!sel.value) return '';
    if (sel.value === PIN_VALUE) {
      return sel === els.from && fromIsLocation ? 'My location' : 'Dropped pin';
    }
    return (nodesById[sel.value] || {}).name || sel.value;
  }

  /* ---------------- top card collapse ---------------- */

  function setTopCollapsed(collapsed) {
    els.topFull.hidden = collapsed;
    els.topMini.hidden = !collapsed;
    els.topcard.classList.toggle('collapsed', collapsed);
    if (collapsed) updateMiniText();
  }

  function updateMiniText() {
    var f = sideName(els.from), t = sideName(els.to);
    els.miniText.textContent =
      f && t ? f + ' → ' + t :
      f ? f + ' → where to?' :
      'Where to?';
  }

  /* ---------------- destination dots ---------------- */

  function drawDestinationDots() {
    graph.nodes.forEach(function (n) {
      if (!n.destination) return;
      var g = MapView.el('g', { 'class': 'dot', 'data-scaled': '1' });
      g.dataset.mx = n.x;
      g.dataset.my = n.y;
      g.dataset.nodeId = n.id;

      g.dataset.nodeType = TYPE_LABELS[n.type] ? n.type : 'amenity';
      var core = MapView.el('circle', {
        'class': 'dot-core', cx: 0, cy: 0, r: 5.5, fill: typeColor(n.type)
      });
      var label = MapView.el('text', { 'class': 'dot-label', x: 0, y: 17 });
      label.textContent = n.name;
      g.appendChild(core);
      g.appendChild(label);
      gDots.appendChild(g);
    });
  }

  /* ---------------- POI category filters ---------------- */

  function applyTypeFilters() {
    var dots = gDots.querySelectorAll('.dot');
    for (var i = 0; i < dots.length; i++) {
      var g = dots[i];
      var show = typeVisible[g.dataset.nodeType];
      // keep the current From/To visible even if its category is off
      var id = g.dataset.nodeId;
      if (id === els.from.value || id === els.to.value) show = true;
      g.style.display = show ? '' : 'none';
    }
  }

  function wireFilters() {
    var chips = els.filters.querySelectorAll('.filter-chip');
    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        var t = chip.dataset.type;
        typeVisible[t] = !typeVisible[t];
        chip.classList.toggle('off', !typeVisible[t]);
        applyTypeFilters();
      });
    });
    // pin the chip row just below the (resizable) top card
    function placeFilters() {
      els.filters.style.top = (els.topcard.getBoundingClientRect().bottom + 8) + 'px';
    }
    if (window.ResizeObserver) new ResizeObserver(placeFilters).observe(els.topcard);
    window.addEventListener('resize', placeFilters);
    placeFilters();
  }

  /* Keep dots/pins constant size on screen: counter-scale by 1/mv.scale. */
  function updateScaledMarkers() {
    var k = 1 / mv.scale;
    var nodes = mv.overlay.querySelectorAll('[data-scaled]');
    for (var i = 0; i < nodes.length; i++) {
      var g = nodes[i];
      g.setAttribute('transform',
        'translate(' + g.dataset.mx + ',' + g.dataset.my + ') scale(' + k + ')');
    }
    gDots.classList.toggle('labels-hidden', mv.scale < LABEL_MIN_SCALE);
  }

  /* Tap a destination dot: first tap sets From, second sets To (and routes). */
  function handleMapTap(p) {
    if (suppressTap) { suppressTap = false; return; }
    var hitRadius = 16 / mv.scale; // ~16 screen px in map units
    var best = null, bestD = Infinity;
    graph.nodes.forEach(function (n) {
      if (!n.destination) return;
      if (!isTypeVisible(TYPE_LABELS[n.type] ? n.type : 'amenity')) return; // hidden category
      var d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < hitRadius && d < bestD) { best = n; bestD = d; }
    });

    if (pendingCal) {
      if (pendingCal.expires && Date.now() > pendingCal.expires) {
        pendingCal = null;                    // correction window closed
      } else if (!pendingCal.soft) {
        calibrateAt(p);                       // out-of-bounds fix: any tap calibrates
        return;
      } else if (!best) {
        calibrateAt(p);                       // wrong-spot fix: taps on empty map calibrate
        return;
      } else {
        pendingCal = null;                    // they picked a destination instead
      }
    }

    if (!best) return;

    if (!els.from.value || (els.from.value && els.to.value)) {
      // fresh selection: start over from this node
      pins.from = null;
      pins.to = null;
      fromIsLocation = false;
      removePinOption(els.from);
      removePinOption(els.to);
      els.from.value = best.id;
      els.to.value = '';
      clearRoute();
      showToast('Starting from ' + best.name + '. Now tap your destination.');
    } else if (best.id === els.from.value) {
      showToast('That is already your starting point — tap somewhere else to go.');
    } else {
      pins.to = null;
      removePinOption(els.to);
      els.to.value = best.id;
      getDirections();
    }
    updatePins();
  }

  /* ---------------- pickers ---------------- */

  function buildSelects() {
    var groups = {};
    graph.nodes.forEach(function (n) {
      if (!n.destination) return;
      var t = TYPE_LABELS[n.type] ? n.type : '_other';
      (groups[t] = groups[t] || []).push(n);
    });

    var order = TYPE_ORDER.filter(function (t) { return groups[t]; });
    if (groups._other) order.push('_other');

    [els.from, els.to].forEach(function (sel) {
      order.forEach(function (t) {
        var og = document.createElement('optgroup');
        og.label = t === '_other' ? 'More places' : TYPE_LABELS[t];
        groups[t]
          .slice()
          .sort(function (a, b) { return a.name.localeCompare(b.name); })
          .forEach(function (n) {
            var opt = document.createElement('option');
            opt.value = n.id;
            opt.textContent = n.name;
            og.appendChild(opt);
          });
        sel.appendChild(og);
      });
    });
  }

  function wireUi() {
    els.go.addEventListener('click', getDirections);
    els.loc.addEventListener('click', useMyLocation);
    els.fab.addEventListener('click', useMyLocation);
    updateFollowUi();

    // keep the follow button floating just above the directions sheet
    function placeFab() {
      var h = els.sheet.hidden ? 0 : els.sheet.getBoundingClientRect().height;
      els.fab.style.bottom = (h + 16) + 'px';
    }
    if (window.ResizeObserver) new ResizeObserver(placeFab).observe(els.sheet);
    window.addEventListener('resize', placeFab);
    placeFab();
    els.collapse.addEventListener('click', function () { setTopCollapsed(true); });
    els.topMini.addEventListener('click', function () { setTopCollapsed(false); });

    function swapEndpoints() {
      var fVal = els.from.value, tVal = els.to.value;
      var tmpPin = pins.from;
      pins.from = pins.to;
      pins.to = tmpPin;
      fromIsLocation = false; // a swapped location pin becomes a plain pin
      if (tVal === PIN_VALUE) { setPinOption(els.from); }
      else { removePinOption(els.from); els.from.value = tVal; }
      if (fVal === PIN_VALUE) { setPinOption(els.to); }
      else { removePinOption(els.to); els.to.value = fVal; }
      updatePins();
      if (route && els.from.value && els.to.value) {
        getDirections();
      }
    }
    els.swap.addEventListener('click', swapEndpoints);
    els.reverse.addEventListener('click', swapEndpoints);

    [els.from, els.to].forEach(function (sel) {
      sel.addEventListener('change', function () {
        if (sel.value !== PIN_VALUE) {
          // picking a real place discards that side's dropped pin
          pins[sideOf(sel)] = null;
          removePinOption(sel);
          if (sel === els.from) fromIsLocation = false;
        }
        clearRoute(); // selection changed — old route is stale
        updatePins();
      });
    });

    els.sheetToggle.addEventListener('click', function () {
      els.sheet.classList.toggle('collapsed');
    });
    // the summary line is also a toggle — a bigger target than the grabber
    els.summary.addEventListener('click', function () {
      els.sheet.classList.toggle('collapsed');
    });
    els.sheetClose.addEventListener('click', function () {
      clearRoute();
      updatePins();
    });
  }

  /* ---------------- routing ---------------- */

  function getDirections() {
    var from = endpointParam(els.from), to = endpointParam(els.to);
    if (!from || !to) {
      showToast('Choose both a starting point and a destination.');
      return;
    }
    if (from === to) {
      showToast('You are already there! Pick two different places.');
      return;
    }

    hideToast();
    els.go.disabled = true;
    els.go.textContent = 'Finding your way…';

    fetch('/api/route?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to))
      .then(function (res) {
        if (res.status === 404) {
          clearRoute();
          updatePins();
          showToast('Sorry — there is no walking path between those two places. Try a different pair.', true, 6000);
          return null;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data) return;
        route = data;
        selectedOpt = 'fastest';
        renderRoutes();
        renderChips();
        renderDetails();
        updatePins();
        els.sheet.hidden = false;
        els.sheet.classList.remove('collapsed');
        setTopCollapsed(true);  // get the pickers out of the way of the route
        fitToRoute();
      })
      .catch(function () {
        showToast('Something went wrong getting directions. Please try again.', true);
      })
      .then(function () {
        els.go.disabled = false;
        els.go.textContent = 'Get Directions';
      });
  }

  function routesDiffer() {
    return route &&
      route.routes.fastest.nodeIds.join('␀') !==
      route.routes.shortest.nodeIds.join('␀');
  }

  function clearRoute() {
    route = null;
    while (gRoutes && gRoutes.firstChild) gRoutes.removeChild(gRoutes.firstChild);
    els.sheet.hidden = true;
  }

  /* ---------------- drawing ---------------- */

  function polylinePoints(r) {
    return r.coords.map(function (c) { return c.x + ',' + c.y; }).join(' ');
  }

  function renderRoutes() {
    while (gRoutes.firstChild) gRoutes.removeChild(gRoutes.firstChild);
    if (!route) return;

    var sel = route.routes[selectedOpt];
    var altKey = selectedOpt === 'fastest' ? 'shortest' : 'fastest';

    if (routesDiffer()) {
      gRoutes.appendChild(MapView.el('polyline', {
        points: polylinePoints(route.routes[altKey]), 'class': 'route-alt'
      }));
    }
    gRoutes.appendChild(MapView.el('polyline', {
      points: polylinePoints(sel), 'class': 'route-casing'
    }));
    gRoutes.appendChild(MapView.el('polyline', {
      points: polylinePoints(sel), 'class': 'route-primary'
    }));
  }

  function makePin(color) {
    var g = MapView.el('g', { 'data-scaled': '1' });
    g.appendChild(MapView.el('ellipse', {
      'class': 'pin-shadow', cx: 0, cy: 1.5, rx: 6, ry: 2.4
    }));
    g.appendChild(MapView.el('path', {
      d: 'M0 0C-6.5 -9 -11 -12.5 -11 -19A11 11 0 1 1 11 -19C11 -12.5 6.5 -9 0 0Z',
      fill: color, stroke: '#ffffff', 'stroke-width': 2
    }));
    g.appendChild(MapView.el('circle', { cx: 0, cy: -19, r: 3.6, fill: '#ffffff' }));
    return g;
  }

  /* Google-style blue dot for "my location". */
  function makeLocationDot() {
    var g = MapView.el('g', { 'data-scaled': '1' });
    g.appendChild(MapView.el('circle', {
      cx: 0, cy: 0, r: 14, fill: '#3b82f6', 'fill-opacity': 0.25
    }));
    g.appendChild(MapView.el('circle', {
      cx: 0, cy: 0, r: 6.5, fill: '#2563eb', stroke: '#ffffff', 'stroke-width': 2.5
    }));
    return g;
  }

  /* Green start / red end pins for the current From/To selection. */
  function updatePins() {
    while (gPins.firstChild) gPins.removeChild(gPins.firstChild);
    var from = endpointCoords(els.from);
    var to = endpointCoords(els.to);
    if (from) {
      var p1 = fromIsLocation && els.from.value === PIN_VALUE
        ? makeLocationDot()
        : makePin('#16a34a');
      p1.dataset.mx = from.x; p1.dataset.my = from.y;
      gPins.appendChild(p1);
    }
    if (to) {
      var p2 = makePin('#dc2626');
      p2.dataset.mx = to.x; p2.dataset.my = to.y;
      gPins.appendChild(p2);
    }
    // mark selected dots
    var dots = gDots.querySelectorAll('.dot');
    for (var i = 0; i < dots.length; i++) {
      var id = dots[i].dataset.nodeId;
      dots[i].classList.toggle('selected',
        id === els.from.value || id === els.to.value);
    }
    updateMiniText();
    applyTypeFilters();
    updateScaledMarkers();
  }

  function fitToRoute() {
    if (!route) return;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    ['fastest', 'shortest'].forEach(function (k) {
      route.routes[k].coords.forEach(function (c) {
        if (c.x < minX) minX = c.x;
        if (c.y < minY) minY = c.y;
        if (c.x > maxX) maxX = c.x;
        if (c.y > maxY) maxY = c.y;
      });
    });
    mv.fitBounds(minX, minY, maxX, maxY, 90);
  }

  /* ---------------- bottom sheet ---------------- */

  function chipLabel(kind, r) {
    var name = kind === 'fastest' ? 'Fastest' : 'Shortest';
    if (!routesDiffer()) name = 'Fastest · Shortest';
    return '<span class="chip-kind">' + name + '</span> — ' +
      fmtTime(r.timeSeconds) + ' · ' + fmtDist(r.distanceMeters);
  }

  function renderChips() {
    els.chips.innerHTML = '';
    if (!route) return;
    var kinds = routesDiffer() ? ['fastest', 'shortest'] : ['fastest'];
    kinds.forEach(function (kind) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (kind === selectedOpt ? ' active' : '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', kind === selectedOpt ? 'true' : 'false');
      b.innerHTML = chipLabel(kind, route.routes[kind]);
      b.addEventListener('click', function () {
        if (selectedOpt === kind) return;
        selectedOpt = kind;
        renderRoutes();
        renderChips();
        renderDetails();
      });
      els.chips.appendChild(b);
    });
  }

  function stepGlyph(text) {
    var t = text.toLowerCase();
    if (t.indexOf('arrive') === 0) return '⚑';
    if (t.indexOf('turn left') === 0) return '↰';
    if (t.indexOf('turn right') === 0) return '↱';
    if (t.indexOf('bear left') === 0) return '↖';
    if (t.indexOf('bear right') === 0) return '↗';
    return '↑';
  }

  function renderDetails() {
    if (!route) return;
    var r = route.routes[selectedOpt];
    var fromName = fromIsLocation && els.from.value === PIN_VALUE
      ? 'My location' : endpointName(route.from);
    var toName = endpointName(route.to);

    els.summary.innerHTML = '';
    var big = document.createTextNode(fmtTime(r.timeSeconds) + ' · ' + fmtDist(r.distanceMeters));
    var small = document.createElement('small');
    small.textContent = fromName + ' → ' + toName;
    els.summary.appendChild(big);
    els.summary.appendChild(small);

    els.steps.innerHTML = '';
    (r.steps || []).forEach(function (s) {
      var li = document.createElement('li');
      var isArrive = s.text.toLowerCase().indexOf('arrive') === 0;
      if (isArrive) li.className = 'arrive';

      var icon = document.createElement('span');
      icon.className = 'step-icon';
      icon.textContent = stepGlyph(s.text);

      var txt = document.createElement('span');
      txt.className = 'step-text';
      txt.textContent = s.text;

      li.appendChild(icon);
      li.appendChild(txt);

      if (s.distanceMeters > 0) {
        var dist = document.createElement('span');
        dist.className = 'step-dist';
        dist.textContent = fmtDist(s.distanceMeters);
        li.appendChild(dist);
      }
      els.steps.appendChild(li);
    });
  }

  init();
})();

</script>
